<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Virtum - Contacto</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-black text-white">

  <!-- NAVBAR -->
  <header class="fixed top-0 left-0 w-full bg-black/80 backdrop-blur-md border-b border-zinc-800 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

      <h1 class="text-3xl font-black tracking-widest">
        VIRTUM
      </h1>

      <nav class="flex gap-6 uppercase text-sm tracking-widest text-gray-300">
        <a href="index.html">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="contacto.html">Contacto</a>
      </nav>

    </div>
  </header>

  <!-- CONTACTO -->
  <section class="pt-36 px-6">

    <div class="max-w-3xl mx-auto text-center">

      <h2 class="text-5xl font-black uppercase mb-8">
        Contacto
      </h2>

      <p class="text-gray-400 mb-10">
        Escríbenos para colaboraciones o pedidos.
      </p>

      <form class="space-y-6">

        <input
          type="text"
          placeholder="Tu nombre"
          class="w-full p-4 rounded-2xl bg-zinc-900 border border-zinc-700"
        >

        <input
          type="email"
          placeholder="Tu correo"
          class="w-full p-4 rounded-2xl bg-zinc-900 border border-zinc-700"
        >

        <textarea
          placeholder="Mensaje"
          rows="6"
          class="w-full p-4 rounded-2xl bg-zinc-900 border border-zinc-700"
        ></textarea>

        <button
          class="bg-white text-black px-8 py-4 rounded-2xl font-bold hover:scale-105 transition"
        >
          Enviar
        </button>

      </form>

    </div>

  </section>

  
 <!-- FOOTER -->
 <footer class="bg-zinc-950 border-t border-zinc-800 pt-16 pb-10">

  <div class="max-w-7xl mx-auto px-8 flex flex-col md:flex-row justify-between items-center gap-6">

    <h2 class="text-2xl font-black tracking-widest">
      VIRTUM
    </h2>

    <p class="text-gray-500 text-sm">
      © 2026 VIRTUM. Todos los derechos reservados.
    </p>

  </div>

</footer>
</body>
</html>
